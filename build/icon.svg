<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/><stop offset=".55" stop-color="#6a3df0"/><stop offset="1" stop-color="#b03ad8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".18" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0ea5b7"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#e83e8c"/></linearGradient>
    <linearGradient id="c6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="c7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe259"/><stop offset="1" stop-color="#ffa62b"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a0b4d" flood-opacity=".35"/>
    </filter>
    <filter id="lift" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-14" dy="34" stdDeviation="26" flood-color="#14063f" flood-opacity=".55"/>
    </filter>
    <filter id="tile" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14063f" flood-opacity=".28"/>
    </filter>
    <symbol id="t" viewBox="0 0 150 150"><rect width="150" height="150" rx="38"/></symbol>
  </defs>

  <!-- base -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3"/>

  <!-- glass screen -->
  <rect x="196" y="196" width="632" height="632" rx="96" fill="url(#panel)" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>

  <!-- grid of apps: 3x3, 150px tiles, 46px gaps, starting at 247 -->
  <g filter="url(#tile)">
    <rect x="247" y="247" width="150" height="150" rx="38" fill="url(#c1)"/>
    <rect x="443" y="247" width="150" height="150" rx="38" fill="url(#c2)"/>
    <rect x="247" y="443" width="150" height="150" rx="38" fill="url(#c3)"/>
    <rect x="443" y="443" width="150" height="150" rx="38" fill="url(#c7)"/>
    <rect x="639" y="443" width="150" height="150" rx="38" fill="url(#c4)"/>
    <rect x="247" y="639" width="150" height="150" rx="38" fill="url(#c5)"/>
    <rect x="443" y="639" width="150" height="150" rx="38" fill="url(#c6)"/>
    <rect x="639" y="639" width="150" height="150" rx="38" fill="url(#c3)" opacity=".0"/>
  </g>
  <!-- tiny glyphs so tiles read as apps -->
  <g fill="#fff" fill-opacity=".9">
    <circle cx="322" cy="322" r="30"/>
    <rect x="483" y="300" width="70" height="44" rx="10"/>
    <path d="M292 548 l30 -60 l30 60 z"/>
    <rect x="483" y="483" width="70" height="70" rx="35" fill="#6a3df0" fill-opacity=".85"/>
    <rect x="679" y="490" width="70" height="56" rx="14"/>
    <path d="M322 742 c-30 -22 -45 -38 -45 -55 a22 22 0 0 1 45 -6 a22 22 0 0 1 45 6 c0 17 -15 33 -45 55z"/>
    <rect x="490" y="686" width="56" height="56" rx="6" transform="rotate(45 518 714)"/>
  </g>
  <!-- tile sheen -->
  <g fill="url(#sheen)">
    <rect x="247" y="247" width="150" height="150" rx="38"/><rect x="443" y="247" width="150" height="150" rx="38"/>
    <rect x="247" y="443" width="150" height="150" rx="38"/><rect x="639" y="443" width="150" height="150" rx="38"/>
    <rect x="247" y="639" width="150" height="150" rx="38"/><rect x="443" y="639" width="150" height="150" rx="38"/>
  </g>

  <!-- empty slot where the lifted app came from -->
  <rect x="641" y="249" width="146" height="146" rx="36" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-dasharray="18 14" stroke-linecap="round"/>
  <!-- empty slot it's headed to -->
  <rect x="641" y="641" width="146" height="146" rx="36" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-dasharray="14 14" stroke-linecap="round"/>

  <!-- motion arc -->
  <path d="M868 400 C 905 500, 880 590, 800 648" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26"/>

  <!-- lifted hero app -->
  <g transform="translate(772 282) rotate(12)" filter="url(#lift)">
    <rect x="-112" y="-112" width="224" height="224" rx="56" fill="url(#hero)"/>
    <rect x="-112" y="-112" width="224" height="224" rx="56" fill="url(#sheen)"/>
    <rect x="-110.5" y="-110.5" width="221" height="221" rx="54.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
    <!-- 2x2 mini-grid glyph -->
    <g fill="#fff">
      <rect x="-58" y="-58" width="50" height="50" rx="14"/><rect x="8" y="-58" width="50" height="50" rx="14"/>
      <rect x="-58" y="8" width="50" height="50" rx="14"/><rect x="8" y="8" width="50" height="50" rx="14" fill-opacity=".55"/>
    </g>
  </g>
</svg>
