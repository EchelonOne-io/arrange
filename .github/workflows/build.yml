name: Build Mac installer

# Publishing a GitHub Release (tag like v1.2.0) builds, signs and notarizes the app and
# attaches the .dmg to that release. "Run workflow" on the Actions tab builds without releasing.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # to attach the .dmg to the release

jobs:
  build:
    # macOS 26 runners ship Xcode 26, whose actool compiles the Icon Composer icon.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Use the release tag as the app version
        if: github.event_name == 'release'
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: npm run dist:mac -- --publish never
        env:
          # Optional: add these repository secrets to sign and notarize the app
          # (needs an Apple Developer account). Without them the app is unsigned.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: dist/*.dmg
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        # Two copies: a versioned file, and a fixed name so
        # /releases/latest/download/Arrange.dmg always serves the newest one.
        run: |
          cp dist/Arrange-*.dmg dist/Arrange.dmg
          gh release upload "$TAG" dist/Arrange-*.dmg dist/Arrange.dmg --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
      - name: Publish to the public downloads repo
        if: github.event_name == 'release'
        # This repo is private, so the public download link lives in EchelonOne-io/arrange-releases.
        # RELEASES_TOKEN: a fine-grained token with Contents read and write on that repo.
        run: |
          printf '%s\n' "$NOTES" > notes.md
          if gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Arrange-*.dmg dist/Arrange.dmg -R "$PUBLIC_REPO" --clobber
          else
            gh release create "$TAG" dist/Arrange-*.dmg dist/Arrange.dmg -R "$PUBLIC_REPO" --title "$TAG" --notes-file notes.md
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          PUBLIC_REPO: EchelonOne-io/arrange-releases
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
